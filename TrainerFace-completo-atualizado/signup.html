<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trainer Face — Criar conta</title>
  <link rel="stylesheet" href="./css/login.css">
</head>
<body>
  <main class="login-container">
    <section class="login-card">
      <div class="brand">
        <div class="brand-icon">TF</div>
        <div>
          <h1>Criar conta</h1>
          <span>Comece a organizar seus treinos</span>
        </div>
      </div>

      <form id="signupForm">
        <div class="field">
          <label for="name">Nome</label>
          <input id="name" type="text" required minlength="2" maxlength="80" autocomplete="name">
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" type="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" type="password" required minlength="6" autocomplete="new-password">
          <small>Use pelo menos 6 caracteres.</small>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirmar senha</label>
          <input id="confirmPassword" type="password" required minlength="6" autocomplete="new-password">
        </div>
        <button id="signupButton" type="submit" class="primary-button full">Criar conta</button>
      </form>

      <p id="signupMessage" class="auth-message" role="status" aria-live="polite"></p>
      <p class="auth-link">Já possui uma conta? <a href="./login.html">Entrar</a></p>
    </section>
  </main>
  <script type="module" src="./js/signup.js"></script>
</body>
</html>
