<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trainer Face — Login</title>
  <link rel="stylesheet" href="./css/login.css">
</head>
<body>
  <main class="login-container">
    <section class="login-card">
      <div class="brand">
        <div class="brand-icon">TF</div>
        <div><h1>Trainer Face</h1><span>Seu planejamento de treinos</span></div>
      </div>
      <form id="loginForm">
        <div class="field"><label for="email">E-mail</label><input id="email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="password">Senha</label><input id="password" type="password" required autocomplete="current-password"></div>
        <button type="submit" class="primary-button full">Entrar</button>
      </form>
      <p id="loginMessage" class="auth-message" role="status" aria-live="polite"></p>
      <p class="auth-link">Ainda não possui conta? <a href="./signup.html">Criar conta</a></p>
    </section>
  </main>
  <script type="module" src="./js/login.js"></script>
</body>
</html>
